server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Unggahan bukti presensi / poster / berkas template (dibatasi backend ±10 MB)
  client_max_body_size 12m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/calendar;

  # Notifikasi real-time (Server-Sent Events): jangan di-buffer, koneksi panjang
  location /api/v1/notifications/stream {
    proxy_pass http://backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
    expires 7d;
  }

  # Aset ber-hash dari Vite: cache lama
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Aplikasi satu halaman: semua rute lain → index.html
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
